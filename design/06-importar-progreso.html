<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Importación CSV — en progreso por lotes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Instrument+Sans:wght@400;500;600&amp;family=Newsreader:opsz,wght@6..72,400;500;600&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Instrument Sans',system-ui,'Segoe UI',sans-serif;background:#F6F4EF;color:#1A1C19;-webkit-font-smoothing:antialiased}
a{color:#14624B}a:hover{color:#0E4636}
button{font-family:inherit}
</style>
</head>
<body>
<div style="width: 760px; height: 460px; box-sizing: border-box; background: #F6F4EF; padding: 32px; display: flex; flex-direction: column;">

  <section style="flex-grow: 1; background: #FFFFFF; border: 1px solid #E2DFD6; border-radius: 12px; box-shadow: 0 18px 44px rgba(16, 20, 16, 0.12); padding: 24px 24px 22px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: flex-start; gap: 14px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#55584F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; margin-top: 2px;" aria-hidden="true"><path d="M13 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V8z"></path><path d="M13 3v5h5"></path></svg>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
        <h2 style="margin: 0; font-family: 'Newsreader', Georgia, serif; font-size: 21px; font-weight: 600;">Importando ventas-agosto.csv</h2>
        <p style="margin: 0; font-size: 13.5px; color: #6A6D64;">1.247 filas leídas en el navegador · se envían en 7 lotes de hasta 200</p>
      </div>
      <button type="button" aria-label="Cerrar" disabled="disabled" style="width: 44px; height: 44px; flex-shrink: 0; margin: -6px -6px 0 0; display: flex; align-items: center; justify-content: center; border: 0; border-radius: 6px; background: transparent; cursor: not-allowed;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4B6AC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12"></path><path d="M18 6L6 18"></path></svg>
      </button>
    </div>

    <div role="status" style="display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: baseline; justify-content: space-between;">
        <span style="font-size: 15px; font-weight: 600; color: #1A1C19;">Lote 4 de 7</span>
        <span style="font-size: 13.5px; color: #55584F; font-variant-numeric: tabular-nums;">800 de 1.247 filas enviadas</span>
      </div>
      <div style="height: 10px; border-radius: 999px; background: #E9E6DD; overflow: hidden;">
        <div style="width: 64%; height: 10px; border-radius: 999px; background: #14624B;"></div>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;">
      <div style="border: 1px solid #E2DFD6; border-radius: 8px; background: #FBFAF6; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #6A6D64;">Insertadas</span>
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 600; color: #14624B; font-variant-numeric: tabular-nums;">763</span>
      </div>
      <div style="border: 1px solid #E2DFD6; border-radius: 8px; background: #FBFAF6; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #6A6D64;">Duplicadas</span>
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 600; color: #24486B; font-variant-numeric: tabular-nums;">31</span>
      </div>
      <div style="border: 1px solid #E2DFD6; border-radius: 8px; background: #FBFAF6; padding: 14px 16px; display: flex; flex-direction: column; gap: 3px;">
        <span style="font-size: 11.5px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #6A6D64;">Inválidas</span>
        <span style="font-family: 'Newsreader', Georgia, serif; font-size: 26px; font-weight: 600; color: #8E2C1F; font-variant-numeric: tabular-nums;">6</span>
      </div>
    </div>

    <div style="margin-top: auto; padding-top: 18px; border-top: 1px solid #EFEDE6; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <span style="max-width: 430px; font-size: 12.5px; color: #6A6D64; line-height: 1.5;">Cada lote viaja con su propia clave de idempotencia: si uno se reintenta, no se duplica nada.</span>
      <button type="button" style="height: 44px; padding: 0 18px; border: 1px solid #CFCBBF; border-radius: 6px; background: #FFFFFF; color: #3B3E38; font-size: 15px; font-weight: 500; cursor: pointer;">Cancelar</button>
    </div>

  </section>
</div>
</body>
</html>
